name: Run Tests and other CI Steps

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  lints-ci:
    #The lint jobs don't need to run on other OS's or python versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # install poetry first for cache
      - name: setup poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "poetry"
      - name: Poetry install
        run: poetry install
      - name: run lint checks
        run: poetry run black --check alpaca/ tests/
      - name: build doc html to lint for errors
        run: ./tools/scripts/generate-docs.sh

  tests-ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ] # supported CPython releases
        os: [ ubuntu-latest ] #in the future we should add windows here
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # install poetry first for cache
      - name: setup poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Poetry install
        run: poetry install
      - name: run tests
        run: poetry run pytest

  # poetry.lock pins pandas 3, but pyproject.toml allows pandas>=1.5.3, so
  # check the oldest and the latest 2.x releases that users can still install.
  tests-ci-legacy-pandas:
    strategy:
      fail-fast: false
      matrix:
        # quoted for the shell: an unquoted "<" would be parsed as a redirect
        pandas-spec: [ '"pandas==1.5.3" "numpy<2"', '"pandas<3"' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # install poetry first for cache
      - name: setup poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "poetry"
      - name: Poetry install
        run: poetry install
      - name: install ${{ matrix.pandas-spec }}
        run: poetry run pip install ${{ matrix.pandas-spec }}
      - name: run tests
        run: poetry run pytest
